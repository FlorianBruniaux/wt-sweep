<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="944" viewBox="0 0 1600 944" role="img" aria-labelledby="title description">
  <title id="title">Git integration and local files in Worktree Sweep</title>
  <desc id="description">Example from the disposable demo. The worktree HEAD and refs/heads/main point to the same verified commit, giving the classification integration_observed. The worktree also contains an untracked notes.txt. A scan with local collection records its hash and metadata without backing up its contents. Local files still need preservation. Backup, restore and removal are unavailable in the read-only MVP.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c30"/>
      <stop offset="1" stop-color="#080e19"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#17263b"/>
      <stop offset="1" stop-color="#101a2a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#82dfc2" stroke-width="2"/>
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .white { fill: #edf3fc; }
      .muted { fill: #b9c8dc; }
      .mint { fill: #82dfc2; }
      .amber { fill: #f0c77c; }
      .label { font-size: 22px; font-weight: 600; letter-spacing: 2px; }
      .heading { font-size: 34px; font-weight: 600; }
      .body { font-size: 28px; }
    </style>
  </defs>

  <rect width="1600" height="944" rx="20" fill="url(#background)"/>
  <text x="64" y="66" class="label muted">WORKTREE SWEEP / READ-ONLY REVIEW</text>
  <text x="64" y="130" font-size="48" font-weight="600" class="white">Review commits and local files</text>
  <text x="64" y="180" class="body muted">In this example, HEAD matches main and notes.txt is untracked.</text>

  <g id="git-evidence">
    <rect x="64" y="222" width="720" height="454" rx="20" fill="url(#panel)" stroke="#3c536f" stroke-width="2"/>
    <text x="104" y="271" class="label mint">GIT RELATIONSHIP</text>
    <text x="104" y="320" class="heading white">HEAD matches the target</text>

    <rect x="104" y="358" width="358" height="64" rx="10" fill="#0c1727" stroke="#415876" stroke-width="2"/>
    <text x="128" y="399" font-size="27" class="white">refs/heads/main</text>
    <rect x="104" y="462" width="358" height="64" rx="10" fill="#0c1727" stroke="#415876" stroke-width="2"/>
    <text x="128" y="503" font-size="27" class="white">worktree HEAD</text>
    <path d="M 462 390 H 502 Q 526 390 526 414 V 418 Q 526 442 552 442 H 580" fill="none" stroke="#82dfc2" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 462 494 H 502 Q 526 494 526 470 V 466 Q 526 442 552 442 H 580" fill="none" stroke="#82dfc2" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="652" cy="442" r="68" fill="#12312f" stroke="#82dfc2" stroke-width="3"/>
    <text x="652" y="434" text-anchor="middle" font-size="27" class="mint">same</text>
    <text x="652" y="472" text-anchor="middle" font-size="27" font-weight="600" class="mint">OID</text>

    <rect x="104" y="566" width="640" height="62" rx="10" fill="#12312f"/>
    <path d="M 126 596 L 136 606 L 154 585" fill="none" stroke="#82dfc2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="177" y="607" font-size="30" class="mint">integration_observed</text>
  </g>

  <g id="local-evidence">
    <rect x="816" y="222" width="720" height="454" rx="20" fill="url(#panel)" stroke="#3c536f" stroke-width="2"/>
    <text x="856" y="271" class="label amber">LOCAL FILES</text>
    <text x="856" y="320" class="heading white">Local work remains</text>

    <path d="M 879 358 H 953 L 995 400 V 513 H 879 Z" fill="#172638" stroke="#f0c77c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 953 358 V 400 H 995 M 901 435 H 967 M 901 458 H 960 M 901 481 H 946" fill="none" stroke="#f0c77c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1040" y="403" font-size="36" font-weight="600" class="white">notes.txt</text>
    <rect x="1040" y="427" width="208" height="48" rx="8" fill="#392c1e"/>
    <text x="1060" y="460" font-size="27" class="amber">untracked</text>
    <text x="1040" y="513" font-size="25" class="muted">scan --local</text>

    <text x="856" y="580" class="body white">Hash and metadata recorded.</text>
    <text x="856" y="626" class="body amber">File contents are not backed up.</text>
  </g>

  <g id="preservation-boundary">
    <rect x="64" y="720" width="1472" height="132" rx="18" fill="#172131" stroke="#766039" stroke-width="2"/>
    <circle cx="118" cy="786" r="26" fill="none" stroke="#f0c77c" stroke-width="3"/>
    <path d="M 118 771 V 788" stroke="#f0c77c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="118" cy="800" r="2.5" fill="#f0c77c"/>
    <text x="168" y="775" font-size="32" font-weight="600" class="white">Local files still need preservation</text>
    <text x="168" y="820" font-size="27" class="muted">Backup, restore and removal are unavailable in this MVP.</text>
  </g>

  <text x="64" y="909" font-size="22" class="muted">Example: disposable demo in docs/getting-started.md</text>
  <text x="1536" y="909" text-anchor="end" font-size="22" class="mint">macOS / read-only</text>
</svg>
